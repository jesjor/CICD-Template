name: CI - cicd

on:
  workflow_dispatch:
  push:
    branches: ["master"]

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: "CICD-Template.slnx"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: >
          dotnet build ${{ env.SOLUTION_PATH }} \
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION_PATH }} \
          --configuration Relsease \
          --no-restore \
          --no-build \
          --vervbosity normal